# dsh-dispatch-gate public bundle template.
#
# The gate row stays disabled until every project path, role, session, and
# control command has been configured. The gate reads control-plane state and
# never edits that state itself.

# Optional provider-level protection against timeout/transport retry storms.
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      maxRetries: 2
      retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT]
      backoff:
        initialDelayMs: 5000
        maxDelayMs: 60000
        jitterRatio: 0.2

- id: llm-deepseek-account
  config:
    retryPolicy:
      mode: normal
      maxRetries: 2
      retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT]
      backoff:
        initialDelayMs: 5000
        maxDelayMs: 60000
        jitterRatio: 0.2

- insert:
    - id: dispatch-gate
      name: dsh-dispatch-gate
      disabled: true
      config:
        projects:
          - project: example-project
            pollMs: 10000
            initialDelayMs: 5000
            peakScheduleEnabled: false
            timeZone: Asia/Shanghai
            peakWindows: [09:00-12:00, 14:00-18:00]
            coordinatorAgent: planner
            workerStateRoles:
              assigned_coding: coding
              awaiting_verification: acceptance
            uiShowIn: [planner]
            requireIdle: true
            skipIfInboxPending: true
            offlineRecoveryEnabled: true
            offlineRetryInitialDelayMs: 5000
            offlineRetryMaxDelayMs: 300000
            offlineRetryJitterRatio: 0.2
            # Explicit role -> persistent root session mappings are recommended.
            agentIds:
              planner: session-aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
              coding: session-bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
              acceptance: session-cccccccc-cccc-4ccc-8ccc-cccccccccccc
            check:
              cwd: /absolute/path/to/project
              command:
                - .venv/bin/python
                - tools/control.py
                - status
                - --json
              timeoutMs: 15000
            jobs:
              - id: coding-dispatch
                agent: coding
                states: [assigned_coding]
                promptFile: ./prompts/coding.md
                retrySeconds: 300
              - id: acceptance-dispatch
                agent: acceptance
                states: [awaiting_verification]
                promptFile: ./prompts/acceptance.md
                retrySeconds: 300
              - id: planner-dispatch
                agent: planner
                states: [idle, assigned_coding, awaiting_verification, verified, submitted]
                controlOnlyStates: [assigned_coding, awaiting_verification]
                promptFile: ./prompts/planner.md
                retrySeconds: 600
